[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtvs"
version = "0.2.2"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
test = ["pytest>=8.2"]

[project.scripts]
dtvs = "dtvs.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
